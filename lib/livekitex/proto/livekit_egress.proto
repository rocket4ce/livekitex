syntax = "proto3";

package livekit;
option go_package = "github.com/livekit/protocol/livekit";

import "livekit_models.proto";

enum EgressStatus {
  EGRESS_STARTING = 0;
  EGRESS_ACTIVE = 1;
  EGRESS_ENDING = 2;
  EGRESS_COMPLETE = 3;
  EGRESS_FAILED = 4;
  EGRESS_ABORTED = 5;
  EGRESS_LIMIT_REACHED = 6;
}

message RoomCompositeEgressRequest {
  string room_name = 1;
  string layout = 2; // (optional)
  bool audio_only = 3; // (default false)
  bool video_only = 4; // (default false)
  string custom_base_url = 5; // template base url (default https://recorder.livekit.io)

  // file output
  EncodedFileOutput file = 6;
  // streaming output
  StreamOutput stream = 7;
  // multiple outputs
  repeated EncodedFileOutput file_outputs = 11;
  repeated StreamOutput stream_outputs = 12;
  repeated SegmentedFileOutput segment_outputs = 13;
  repeated ImageOutput image_outputs = 14;

  // encoding options
  oneof options {
    EncodingOptionsPreset preset = 8;
    EncodingOptions advanced = 9;
  }

  // deprecated (use file_outputs)
  SegmentedFileOutput segments = 10 [deprecated = true];
}

message TrackCompositeEgressRequest {
  string room_name = 1;
  string audio_track_id = 2; // (optional)
  string video_track_id = 3; // (optional)

  // file output
  EncodedFileOutput file = 4;
  // streaming output
  StreamOutput stream = 5;
  // multiple outputs
  repeated EncodedFileOutput file_outputs = 11;
  repeated StreamOutput stream_outputs = 12;
  repeated SegmentedFileOutput segment_outputs = 13;
  repeated ImageOutput image_outputs = 14;

  // encoding options
  oneof options {
    EncodingOptionsPreset preset = 6;
    EncodingOptions advanced = 7;
  }

  // deprecated (use file_outputs)
  SegmentedFileOutput segments = 8 [deprecated = true];
}

message TrackEgressRequest {
  string room_name = 1;
  string track_id = 2;

  oneof output {
    DirectFileOutput file = 3;
    string websocket_url = 4;
  }
}

message ParticipantEgressRequest {
  string room_name = 1;
  string identity = 2;
  bool screen_share = 3; // (default false)

  // file output
  EncodedFileOutput file = 4;
  // streaming output
  StreamOutput stream = 5;
  // multiple outputs
  repeated EncodedFileOutput file_outputs = 11;
  repeated StreamOutput stream_outputs = 12;
  repeated SegmentedFileOutput segment_outputs = 13;
  repeated ImageOutput image_outputs = 14;

  // encoding options
  oneof options {
    EncodingOptionsPreset preset = 6;
    EncodingOptions advanced = 7;
  }

  // deprecated (use file_outputs)
  SegmentedFileOutput segments = 8 [deprecated = true];
}

message WebEgressRequest {
  string url = 1;
  bool audio_only = 2; // (default false)
  bool video_only = 3; // (default false)
  bool await_start_signal = 4; // (default false)

  // file output
  EncodedFileOutput file = 5;
  // streaming output
  StreamOutput stream = 6;
  // multiple outputs
  repeated EncodedFileOutput file_outputs = 11;
  repeated StreamOutput stream_outputs = 12;
  repeated SegmentedFileOutput segment_outputs = 13;
  repeated ImageOutput image_outputs = 14;

  // encoding options
  oneof options {
    EncodingOptionsPreset preset = 7;
    EncodingOptions advanced = 8;
  }

  // deprecated (use file_outputs)
  SegmentedFileOutput segments = 9 [deprecated = true];
}

message UpdateLayoutRequest {
  string egress_id = 1;
  string layout = 2;
}

message UpdateStreamRequest {
  string egress_id = 1;
  repeated string add_output_urls = 2;
  repeated string remove_output_urls = 3;
}

message ListEgressRequest {
  string room_name = 1; // (optional, filter by room name)
  string egress_id = 2; // (optional, filter by egress ID)
  bool active = 3; // (optional, list active egress only)
}

message ListEgressResponse {
  repeated EgressInfo items = 1;
}

message StopEgressRequest {
  string egress_id = 1;
}

message EgressInfo {
  string egress_id = 1;
  string room_id = 2;
  string room_name = 13;
  EgressStatus status = 3;
  int64 started_at = 10;
  int64 ended_at = 11;
  int64 updated_at = 18;
  string details = 21;
  string error = 9;

  // room composite egress
  RoomCompositeEgressRequest room_composite = 4;
  // track composite egress
  TrackCompositeEgressRequest track_composite = 5;
  // track egress
  TrackEgressRequest track = 6;
  // web egress
  WebEgressRequest web = 7;
  // participant egress
  ParticipantEgressRequest participant = 19;

  // results of the egress
  repeated StreamInfo stream_results = 8;
  repeated FileInfo file_results = 12;
  repeated SegmentedFileInfo segment_results = 16;
  repeated ImagesInfo image_results = 17;

  // deprecated fields (use stream_results and file_results)
  StreamInfo stream = 14 [deprecated = true];
  FileInfo file = 15 [deprecated = true];
}

message StreamInfo {
  string url = 1;
  int64 started_at = 2;
  int64 ended_at = 3;
  int64 duration = 4;
  StreamInfo.Status status = 5;
  string error = 6;

  enum Status {
    ACTIVE = 0;
    FINISHED = 1;
    FAILED = 2;
  }
}

message FileInfo {
  string filename = 1;
  int64 started_at = 2;
  int64 ended_at = 3;
  int64 duration = 6;
  int64 size = 4;
  string location = 5;
}

message SegmentedFileInfo {
  string playlist = 1;
  int64 started_at = 2;
  int64 ended_at = 3;
  int64 duration = 4;
  int64 size = 5;
  string playlist_location = 6;
  int64 segment_count = 7;
}

message ImagesInfo {
  int64 started_at = 1;
  int64 ended_at = 2;
  int64 image_count = 3;
}

message DirectFileOutput {
  // see egress docs for templating (default {room_name} - {time})
  string filepath = 1;
  bool disable_manifest = 5;

  oneof output {
    S3Upload s3 = 2;
    GCPUpload gcp = 3;
    AzureBlobUpload azure = 4;
    AliOSSUpload alioss = 6;
  }
}

message EncodedFileOutput {
  // (optional)
  EncodedFileType file_type = 1;
  // see egress docs for templating (default {room_name} - {time})
  string filepath = 2;
  bool disable_manifest = 6;

  oneof output {
    S3Upload s3 = 3;
    GCPUpload gcp = 4;
    AzureBlobUpload azure = 5;
    AliOSSUpload alioss = 7;
  }
}

message SegmentedFileOutput {
  // (optional)
  SegmentedFileProtocol protocol = 1;
  // see egress docs for templating (default {room_name} - {time})
  string filename_prefix = 2;
  // (optional)
  string playlist_name = 3;
  // (optional)
  uint32 segment_duration = 4;
  // (optional, disabled if not provided). Path of a live playlist
  string filename_suffix = 11;
  bool disable_manifest = 8;

  oneof output {
    S3Upload s3 = 5;
    GCPUpload gcp = 6;
    AzureBlobUpload azure = 7;
    AliOSSUpload alioss = 9;
  }
}

enum SegmentedFileProtocol {
  DEFAULT_SEGMENTED_FILE_PROTOCOL = 0;
  HLS_PROTOCOL = 1;
}

enum EncodedFileType {
  DEFAULT_FILETYPE = 0;
  MP4 = 1;
  OGG = 2;
}

message StreamOutput {
  // required
  StreamProtocol protocol = 1;
  // required
  repeated string urls = 2;
}

enum StreamProtocol {
  // allow LiveKit to pick
  DEFAULT_PROTOCOL = 0;
  RTMP = 1;
  SRT = 2;
}

message ImageOutput {
  // (optional)
  ImageCodec codec = 1;
  // (optional)
  uint32 width = 2;
  // (optional)
  uint32 height = 3;
  // see egress docs for templating (default {room_name} - {time})
  string filename_prefix = 4;
  // (optional)
  string filename_suffix = 5;
  // (optional)
  uint32 image_interval = 6;
  bool disable_manifest = 7;

  oneof output {
    S3Upload s3 = 8;
    GCPUpload gcp = 9;
    AzureBlobUpload azure = 10;
    AliOSSUpload alioss = 11;
  }
}

enum ImageCodec {
  IC_DEFAULT = 0;
  IC_JPEG = 1;
}

message S3Upload {
  string access_key = 1;
  string secret = 2;
  string session_token = 9;
  string region = 3;
  string endpoint = 4;
  string bucket = 5;
  bool force_path_style = 6;
  map<string, string> metadata = 7;
  string tagging = 8;
}

message GCPUpload {
  bytes credentials = 1; // service account credentials serialized in JSON "credentials" key
  string bucket = 2;
}

message AzureBlobUpload {
  string account_name = 1;
  string account_key = 2;
  string container_name = 3;
}

message AliOSSUpload {
  string access_key = 1;
  string secret = 2;
  string region = 3;
  string endpoint = 4;
  string bucket = 5;
}

enum EncodingOptionsPreset {
  // All presets use 44.1kHz audio
  H264_720P_30 = 0;   //  1280x720,  30fps, 3000kpbs, H.264_BASELINE
  H264_720P_60 = 1;   //  1280x720,  60fps, 4500kbps, H.264_BASELINE
  H264_1080P_30 = 2;  // 1920x1080,  30fps, 4500kbps, H.264_MAIN
  H264_1080P_60 = 3;  // 1920x1080,  60fps, 6000kbps, H.264_MAIN

  // Portrait presets
  PORTRAIT_H264_720P_30 = 4;   //  720x1280,  30fps, 3000kpbs, H.264_BASELINE
  PORTRAIT_H264_720P_60 = 5;   //  720x1280,  60fps, 4500kbps, H.264_BASELINE
  PORTRAIT_H264_1080P_30 = 6;  // 1080x1920,  30fps, 4500kbps, H.264_MAIN
  PORTRAIT_H264_1080P_60 = 7;  // 1080x1920,  60fps, 6000kbps, H.264_MAIN
}

message EncodingOptions {
  // (default 1920)
  int32 width = 1;
  // (default 1080)
  int32 height = 2;
  // (default 24)
  int32 depth = 3;
  // (default 30)
  int32 framerate = 4;
  // (default OPUS)
  AudioCodec audio_codec = 5;
  // (default 44100)
  int32 audio_bitrate = 6;
  // quality setting on audio encoder
  int32 audio_quality = 11;
  // (default 44100)
  int32 audio_frequency = 7;
  // (default H264_MAIN)
  VideoCodec video_codec = 8;
  // (default 4500)
  int32 video_bitrate = 9;
  // quality setting on video encoder
  int32 video_quality = 12;
  // H264 Profile (default MAIN)
  H264Profile video_profile = 10;
}

enum AudioCodec {
  DEFAULT_AC = 0;
  OPUS = 1;
  AAC = 2;
}

enum VideoCodec {
  DEFAULT_VC = 0;
  H264_BASELINE_CODEC = 1;
  H264_MAIN_CODEC = 2;
  H264_HIGH_CODEC = 3;
}

enum H264Profile {
  H264_BASELINE_PROFILE = 0;
  H264_MAIN_PROFILE = 1;
  H264_HIGH_PROFILE = 2;
}

// egress service that can be used to start/stop room composite egress
service EgressService {
  // start room composite egress
  rpc StartRoomCompositeEgress(RoomCompositeEgressRequest) returns (EgressInfo);

  // start track composite egress
  rpc StartTrackCompositeEgress(TrackCompositeEgressRequest) returns (EgressInfo);

  // start track egress
  rpc StartTrackEgress(TrackEgressRequest) returns (EgressInfo);

  // start web egress
  rpc StartWebEgress(WebEgressRequest) returns (EgressInfo);

  // start participant egress
  rpc StartParticipantEgress(ParticipantEgressRequest) returns (EgressInfo);

  // update layout
  rpc UpdateLayout(UpdateLayoutRequest) returns (EgressInfo);

  // add or remove stream outputs
  rpc UpdateStream(UpdateStreamRequest) returns (EgressInfo);

  // list egress
  rpc ListEgress(ListEgressRequest) returns (ListEgressResponse);

  // stop egress
  rpc StopEgress(StopEgressRequest) returns (EgressInfo);
}
